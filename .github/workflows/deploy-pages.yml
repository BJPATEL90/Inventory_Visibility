name: Deploy Inventory Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend configuration
        env:
          VITE_GOOGLE_CLIENT_ID: 1021762366002-nsjs0p1e38ilkm3cogaagu03kdbm0s32.apps.googleusercontent.com
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Add VITE_GOOGLE_CLIENT_ID to the Pages workflow before deploying."
            exit 1
          fi

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzb3RLplMSuW6BcKVCo7HG4Jbd62qEkRF0gjMCjSrpn7F15iZKbqRSD9u_YKjEIa9HFNQ/exec
          VITE_GOOGLE_CLIENT_ID: 1021762366002-nsjs0p1e38ilkm3cogaagu03kdbm0s32.apps.googleusercontent.com
          VITE_GOOGLE_ALLOWED_DOMAIN: mosaicwellness.in
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Publish GitHub Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_3.outputs.page_url || steps.deployment_attempt_2.outputs.page_url || steps.deployment_attempt_1.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_attempt_2
        if: steps.deployment_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_attempt_3
        if: >-
          steps.deployment_attempt_1.outcome == 'failure' &&
          steps.deployment_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
